globals:
    - id: seconds_bar_scroll
      type: int
      initial_value: '-1'
    - id: last_minute_unit
      type: int
      initial_value: '-1'

esphome:
  name: "matrix-led-esp32"
  friendly_name: "matrix-led-esp32"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "Kc1b550qQ9w1lh3nY7NhgMvj9WHoo6fJRFQQEEQjW3o="

ota:
  - platform: esphome
    password: "7d729266a8007ece61150050abb2ff56"

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    fast_connect: True
    manual_ip:
        static_ip: 192.168.0.160
        gateway: !secret gateway
        subnet: !secret subnet

time:
  - platform: homeassistant
    id: time_keeper
    timezone: "Europe/Brussels"

font:
  - file: "fonts/digit-8x4.ttf"
    id: digit_font
    size: 14

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

display:
  - platform: max7219digit
    cs_pin: GPIO05
    num_chips: 4
    intensity: 1
    update_interval: 65ms
    lambda: |-
      auto now = id(time_keeper).now();
      auto minute = now.minute;
      int minute_decade = minute / 10;
      int minute_unit = minute % 10; 

      // ESP_LOGD("> TIME", "Minutes: %d %d", minute_decade, minute_unit);

      if (minute_unit != id(last_minute_unit) && id(last_minute_unit) != -1) {
        id(seconds_bar_scroll) = 7;
      }

      it.strftime(2, 0, id(digit_font), "%H %M", now);

      if ((now.second % 2) == 0) {
        it.draw_pixel_at(12, 2, COLOR_ON);
        it.draw_pixel_at(12, 5, COLOR_ON);
      }

      if (id(seconds_bar_scroll) > 0) {
        it.filled_rectangle(28, 8 - id(seconds_bar_scroll), 2, 8, COLOR_ON);
        id(seconds_bar_scroll) -= 1;
      } else {
        int seconds = id(time_keeper).now().second;
        int bar_height = (seconds * 9) / 60;
        
        if (bar_height > 0) {
          it.filled_rectangle(28, 8 - bar_height, 2, 8, COLOR_ON);
        }
      }

      if (minute_unit != id(last_minute_unit)) {
        id(last_minute_unit) = minute_unit;
      }
    
    