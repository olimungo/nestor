esphome:
  name: "matrix-led-esp8266"
  friendly_name: "matrix-led-esp8266"

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "iFEiCM39wAk8D64HV0GR4pRXzVJoVwPm0niFqAOqbIE="

ota:
  - platform: esphome
    password: "5ac1c853eb400d208d181c79cfd836e8"

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password
    fast_connect: True
    manual_ip:
        static_ip: 192.168.0.161
        gateway: !secret gateway
        subnet: !secret subnet

time:
  - platform: homeassistant
    id: time_keeper
    timezone: "Europe/Brussels"

font:
  - file: "fonts/digit-8x4.ttf"
    id: digit_font
    size: 14

spi:
  clk_pin: D5
  mosi_pin: D7

display:
  - platform: max7219digit
    cs_pin: D6
    num_chips: 4
    intensity: 1
    update_interval: 500ms
    lambda: |-
      it.strftime(2, 0, id(digit_font), "%H %M", id(time_keeper).now());

      if ((id(time_keeper).now().second % 2) == 0) {
        it.draw_pixel_at(12, 2, COLOR_ON);
        it.draw_pixel_at(12, 5, COLOR_ON);
      }

      int seconds = id(time_keeper).now().second;
      int bar_height = (seconds * 9) / 60;
      
      if (bar_height > 0) {
        it.filled_rectangle(28, 8 - bar_height, 2, 8, COLOR_ON);
      }
    